<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SemperFit365</title>
<meta name="description" content="Turn your Google Sheet workout program into an easy-to-use workout app." />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/styles.css" />
<script>
  // Applied before CSS paints so there's no flash of the wrong theme.
  try {
    var t = localStorage.getItem("sf365.theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="sync-status" class="sync-status" aria-live="polite"></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="program" aria-label="Program">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zM4 11h16v2H4zM4 18h16v2H4z"/></svg>
      <span>Program</span>
    </button>
    <button class="tab" data-route="history" aria-label="History">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5v4l5-4.5L13 0z"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-route="nutrition" aria-label="Nutrition">
      <svg viewBox="0 0 24 24"><path d="M17 2c-1.5 2-2 4-2 6 0 3 2 4 2 4s2-1 2-4c0-2-.5-4-2-6zM11 8c-3.9 0-7 4-7 9 0 3 1.5 5 3 5 1.2 0 1.5-.8 2.5-.8s1.3.8 2.5.8 1.3-.8 2.5-.8 1.3.8 2.5.8c1.5 0 3-2 3-5 0-1.7-.5-3.3-1.3-4.6-.8-1.3-2-2.4-3.5-2.4-1 0-1.6.6-2.5.6S11.9 8 11 8z"/></svg>
      <span>Nutrition</span>
    </button>
    <button class="tab" data-route="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.9 7.9 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a7.9 7.9 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.9 7.9 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.9 7.9 0 0 0 1.7 1l.4 2.9h4l.4-2.9a7.9 7.9 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <script src="vendor/firebase/firebase-app-compat.js"></script>
  <script src="vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="vendor/firebase/firebase-auth-compat.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
